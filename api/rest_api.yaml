openapi: 3.0.0

info:
  title: Travel Social Network API
  description: REST API for a social network for travelers
  version: 1.1.0

tags:
  - name: Auth
    description: Registration, login, token refresh and logout

  - name: Users
    description: User profiles

  - name: Subscriptions
    description: Subscriptions between users

  - name: Posts
    description: Travel posts

  - name: Comments
    description: Comments for posts

  - name: Reactions
    description: Reactions (likes) to posts

  - name: Feed
    description: User feed

  - name: Places
    description: Travel places

  - name: Media
    description: Photo upload

# All endpoints require a valid access token by default.
# Public endpoints (registration and login) override this with `security: []`.
security:
  - bearerAuth: []

paths:

  # --------------------------------------------------
  # AUTH
  # --------------------------------------------------

  /users:
    post:
      summary: Register user
      description: |
        Creates a new user account.
        Returns the created profile and a pair of tokens, so the user is logged in right after registration.
      tags:
        - Auth
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

            example:
              username: "elvira"
              email: "elvira@example.com"
              password: "S3cure-Passw0rd"
              display_name: "Elvira"

      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

        '400':
          description: Invalid registration data

        '409':
          description: Username or email already taken

        '500':
          description: Server error


  /tokens:
    post:
      summary: Issue tokens (login or refresh)
      description: |
        Issues a new pair of access and refresh tokens.

        - `grant_type: password` — login by username or email and password.
        - `grant_type: refresh_token` — exchange a valid refresh token for a new pair.
          The old refresh token becomes invalid (refresh token rotation).
      tags:
        - Auth
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'

            examples:
              login:
                summary: Login
                value:
                  grant_type: "password"
                  login: "elvira@example.com"
                  password: "S3cure-Passw0rd"
              refresh:
                summary: Refresh tokens
                value:
                  grant_type: "refresh_token"
                  refresh_token: "def50200a1b2c3..."

      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

        '400':
          description: Invalid request (unknown grant_type or missing fields)

        '401':
          description: Invalid credentials, or refresh token is expired or revoked

        '429':
          description: Too many login attempts

        '500':
          description: Server error


  /tokens/current:
    delete:
      summary: Logout
      description: |
        Revokes the refresh token of the current session.
        The session is identified by the `sid` claim of the access token.
        The access token stays valid until it expires (15 minutes).
      tags:
        - Auth

      responses:
        '204':
          description: Logged out

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          description: Server error


  # --------------------------------------------------
  # USERS
  # --------------------------------------------------

  /users/me:
    get:
      summary: Get current user profile
      description: Returns the profile of the authenticated user, including private fields
      tags:
        - Users

      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          description: Server error


    patch:
      summary: Update current user profile
      description: Updates the profile of the authenticated user
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'

            example:
              display_name: "Elvira O."
              bio: "Mountains, trains and coffee"
              avatar_media_id: "3f2b8c1e-9a4d-4e2b-8f1a-6c7d8e9f0a1b"

      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'

        '400':
          description: Invalid profile data

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Avatar media not found

        '500':
          description: Server error


  /users/{user_id}:
    get:
      summary: Get user profile
      description: Returns public information about a user
      tags:
        - Users

      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: integer

      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: User not found

        '500':
          description: Server error


  # --------------------------------------------------
  # SUBSCRIPTIONS
  # --------------------------------------------------

  /users/me/subscriptions:
    post:
      summary: Subscribe to user
      description: Current user subscribes to another user
      tags:
        - Subscriptions

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
                  description: User to subscribe to
                  example: 456

      responses:
        '201':
          description: Subscription created

        '400':
          description: Invalid request (for example, subscribing to yourself)

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: User not found

        '409':
          description: Already subscribed to this user

        '500':
          description: Server error


  /users/me/subscriptions/{user_id}:
    delete:
      summary: Unsubscribe from user
      description: Current user removes subscription to another user
      tags:
        - Subscriptions

      parameters:
        - name: user_id
          in: path
          required: true
          description: User to unsubscribe from
          schema:
            type: integer

      responses:
        '204':
          description: Subscription removed

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Subscription not found

        '500':
          description: Server error


  /users/{user_id}/subscriptions:
    get:
      summary: Get user subscriptions
      description: Returns users the specified user is subscribed to
      tags:
        - Subscriptions

      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: integer

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100

        - name: cursor
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Subscriptions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: User not found

        '500':
          description: Server error


  /users/{user_id}/followers:
    get:
      summary: Get user followers
      description: Returns users who are subscribed to the specified user
      tags:
        - Subscriptions

      parameters:
        - name: user_id
          in: path
          required: true
          description: User identifier
          schema:
            type: integer

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100

        - name: cursor
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Followers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: User not found

        '500':
          description: Server error


  # --------------------------------------------------
  # POSTS
  # --------------------------------------------------

  /posts:
    post:
      summary: Create post
      description: Creates a new travel post
      tags:
        - Posts

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'

            example:
              text: "Amazing trip to Paris!"
              place_id: 42
              media_ids:
                - "3f2b8c1e-9a4d-4e2b-8f1a-6c7d8e9f0a1b"
                - "7c1d2e3f-4a5b-4c6d-8e9f-0a1b2c3d4e5f"

      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

        '400':
          description: Invalid post data

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Place or media not found

        '500':
          description: Server error


    get:
      summary: Get posts
      description: |
        Returns a paginated list of posts in reverse chronological order.
        Exactly one filter must be set:

        - `user_id` — posts of a user (own posts or posts of another traveler);
        - `place_id` — posts associated with a place.
      tags:
        - Posts

      parameters:
        - name: user_id
          in: query
          required: false
          description: Return posts of this user
          schema:
            type: integer
            example: 123

        - name: place_id
          in: query
          required: false
          description: Return posts associated with this place
          schema:
            type: integer
            example: 42

        - name: limit
          in: query
          required: false
          description: Number of posts to return
          schema:
            type: integer
            default: 20
            maximum: 100

        - name: cursor
          in: query
          required: false
          description: Cursor for pagination
          schema:
            type: string

      responses:
        '200':
          description: Posts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'

        '400':
          description: None or both of user_id and place_id are set

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: User or place not found

        '500':
          description: Server error


  /posts/{post_id}:
    get:
      summary: Get post
      description: Returns a single post
      tags:
        - Posts

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

      responses:
        '200':
          description: Post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Post not found

        '500':
          description: Server error


    patch:
      summary: Update post
      description: Updates a post created by the current user
      tags:
        - Posts

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'

      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

        '400':
          description: Invalid post data

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: User is not allowed to modify this post

        '404':
          description: Post not found

        '500':
          description: Server error


    delete:
      summary: Delete post
      description: Deletes a post created by the current user
      tags:
        - Posts

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

      responses:
        '204':
          description: Post deleted

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: User is not allowed to delete this post

        '404':
          description: Post not found

        '500':
          description: Server error


  # --------------------------------------------------
  # COMMENTS
  # --------------------------------------------------

  /posts/{post_id}/comments:
    get:
      summary: Get post comments
      description: Returns comments for a post
      tags:
        - Comments

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100

        - name: cursor
          in: query
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Comments list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Post not found

        '500':
          description: Server error


    post:
      summary: Add comment
      description: Creates a comment for a post
      tags:
        - Comments

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Comment text
                  example: "Beautiful place!"

      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

        '400':
          description: Invalid comment

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Post not found

        '500':
          description: Server error


  /posts/{post_id}/comments/{comment_id}:
    delete:
      summary: Delete comment
      description: Deletes a comment created by the current user
      tags:
        - Comments

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

        - name: comment_id
          in: path
          required: true
          description: Comment identifier
          schema:
            type: integer

      responses:
        '204':
          description: Comment deleted

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: User is not allowed to delete this comment

        '404':
          description: Post or comment not found, or the comment does not belong to this post

        '500':
          description: Server error


  # --------------------------------------------------
  # REACTIONS
  # --------------------------------------------------

  /posts/{post_id}/reactions/me:
    put:
      summary: Like post
      description: |
        Sets the current user's reaction (like) on a post.
        The system has a single reaction type, so the request has no body.
        The operation is idempotent: a repeated request does not create a second like.
      tags:
        - Reactions

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

      responses:
        '204':
          description: Reaction is set

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Post not found

        '500':
          description: Server error


    delete:
      summary: Remove like
      description: |
        Removes the current user's reaction from a post.
        The operation is idempotent: if the user has not liked the post, the request still succeeds.
      tags:
        - Reactions

      parameters:
        - name: post_id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer

      responses:
        '204':
          description: Reaction is removed (or was not set)

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Post not found

        '500':
          description: Server error


  # --------------------------------------------------
  # FEED
  # --------------------------------------------------

  /feed:
    get:
      summary: Get user feed
      description: |
        Returns posts from users the current user is subscribed to, in reverse chronological order.
        The feed is personal and is read from the materialized feed, so it is a separate endpoint
        rather than a filter of GET /posts.
      tags:
        - Feed

      parameters:
        - name: limit
          in: query
          required: false
          description: Number of posts to return
          schema:
            type: integer
            default: 20
            maximum: 100

        - name: cursor
          in: query
          required: false
          description: Cursor for pagination
          schema:
            type: string

      responses:
        '200':
          description: User feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          description: Server error


  # --------------------------------------------------
  # PLACES
  # --------------------------------------------------

  /places:
    get:
      summary: Search places
      description: Returns up to 10 places popular with travelers in the specified region or city, sorted by popularity
      tags:
        - Places

      parameters:
        - name: query
          in: query
          required: true
          description: Region or city name
          schema:
            type: string
            example: "Paris"

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 10

      responses:
        '200':
          description: Places list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'

        '400':
          description: Search query is invalid

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          description: Server error


  /places/{place_id}:
    get:
      summary: Get place
      description: Returns information about a place. Posts of the place are returned by GET /posts?place_id={place_id}
      tags:
        - Places

      parameters:
        - name: place_id
          in: path
          required: true
          description: Place identifier
          schema:
            type: integer

      responses:
        '200':
          description: Place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Place not found

        '500':
          description: Server error


  # --------------------------------------------------
  # MEDIA
  # --------------------------------------------------

  /media:
    post:
      summary: Create media upload
      description: |
        Registers a new photo and returns a pre-signed URL for uploading it to object storage.
        The returned media_id is used in CreatePostRequest.media_ids or UpdateProfileRequest.avatar_media_id.
      tags:
        - Media

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_type
              properties:
                content_type:
                  type: string
                  description: MIME type of the photo
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                  example: "image/jpeg"

      responses:
        '201':
          description: Upload URL created
          content:
            application/json:
              schema:
                type: object
                required:
                  - media_id
                  - upload_url
                properties:
                  media_id:
                    type: string
                    format: uuid
                    example: "3f2b8c1e-9a4d-4e2b-8f1a-6c7d8e9f0a1b"
                  upload_url:
                    type: string
                    format: uri
                    example: "https://storage.example.com/upload/..."

        '400':
          description: Invalid content type

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          description: Server error


# --------------------------------------------------
# COMPONENTS
# --------------------------------------------------

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from POST /tokens, sent as `Authorization: Bearer <access_token>`.
        Lifetime is 15 minutes. Claims: `sub` — user ID, `sid` — session ID, `exp` — expiration time.
        The token is verified by its signature, without a database lookup.

  responses:
    Unauthorized:
      description: Access token is missing, invalid or expired

  schemas:

    # ---------- Auth ----------

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - display_name
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        display_name:
          type: string
          maxLength: 100


    RegisterResponse:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        tokens:
          $ref: '#/components/schemas/TokenResponse'


    TokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum:
            - password
            - refresh_token
          description: |
            `password` — login, requires `login` and `password`.
            `refresh_token` — token refresh, requires `refresh_token`.
        login:
          type: string
          description: Username or email
          example: "elvira@example.com"
        password:
          type: string
          format: password
        refresh_token:
          type: string


    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: JWT for the Authorization header
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Opaque token for POST /tokens with grant_type refresh_token. Lifetime is 30 days
          example: "def50200a1b2c3..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900


    # ---------- Users ----------

    User:
      type: object
      required:
        - id
        - username
        - display_name
      properties:
        id:
          type: integer
          example: 123
        username:
          type: string
          example: "elvira"
        display_name:
          type: string
          example: "Elvira"
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: "https://cdn.example.com/avatars/123/3f2b8c1e.jpg"
        bio:
          type: string
          nullable: true
          maxLength: 500
          example: "Mountains, trains and coffee"


    CurrentUser:
      description: Profile of the authenticated user, including private fields
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - email
            - created_at
          properties:
            email:
              type: string
              format: email
              example: "elvira@example.com"
            created_at:
              type: string
              format: date-time
              example: "2026-01-15T10:00:00Z"


    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 500
          nullable: true
        avatar_media_id:
          type: string
          format: uuid
          nullable: true
          description: ID from POST /media. null removes the avatar


    UserListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: string
          nullable: true
          example: "eyJpZCI6MTIzfQ=="


    # ---------- Posts ----------

    Post:
      type: object
      required:
        - id
        - author
        - text
        - photos
        - place
        - created_at
        - reaction_count
        - comment_count
        - liked_by_me
      properties:
        id:
          type: integer
          example: 1001

        author:
          $ref: '#/components/schemas/User'

        text:
          type: string
          maxLength: 2000
          example: "My trip to Paris"

        photos:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Photo'

        place:
          $ref: '#/components/schemas/Place'

        reaction_count:
          type: integer
          example: 152

        comment_count:
          type: integer
          example: 34

        liked_by_me:
          type: boolean
          description: Whether the current user has liked this post
          example: true

        created_at:
          type: string
          format: date-time
          example: "2026-09-20T12:30:00Z"


    Photo:
      type: object
      required:
        - id
        - preview_url
        - original_url
      properties:
        id:
          type: string
          format: uuid
          example: "3f2b8c1e-9a4d-4e2b-8f1a-6c7d8e9f0a1b"
        preview_url:
          type: string
          format: uri
          example: "https://cdn.example.com/photos/previews/3f2b8c1e.jpg"
        original_url:
          type: string
          format: uri
          example: "https://cdn.example.com/photos/originals/3f2b8c1e.jpg"


    CreatePostRequest:
      type: object
      required:
        - text
        - place_id
      properties:
        text:
          type: string
          maxLength: 2000
          description: Post text

        place_id:
          type: integer
          description: Place associated with the post

        media_ids:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
          description: IDs of uploaded photos in display order


    UpdatePostRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 2000

        place_id:
          type: integer

        media_ids:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid


    PostListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'

        next_cursor:
          type: string
          nullable: true
          example: "eyJjcmVhdGVkX2F0IjoiMjAyNi0wOS0yMFQxMjozMDowMFoifQ=="


    # ---------- Comments ----------

    Comment:
      type: object
      required:
        - id
        - post_id
        - author
        - text
        - created_at
      properties:
        id:
          type: integer
          example: 5001

        post_id:
          type: integer
          example: 1001

        author:
          $ref: '#/components/schemas/User'

        text:
          type: string
          example: "Beautiful place!"

        created_at:
          type: string
          format: date-time
          example: "2026-09-20T13:00:00Z"


    CommentListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

        next_cursor:
          type: string
          nullable: true
          example: "eyJpZCI6NTAwMX0="


    # ---------- Places ----------

    Place:
      type: object
      required:
        - id
        - name
        - country
      properties:
        id:
          type: integer
          example: 42

        name:
          type: string
          example: "Eiffel Tower"

        city:
          type: string
          nullable: true
          example: "Paris"

        region:
          type: string
          nullable: true
          example: "Ile-de-France"

        country:
          type: string
          example: "France"

        latitude:
          type: number
          format: double
          example: 48.8584

        longitude:
          type: number
          format: double
          example: 2.2945


    PlaceListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Place'
